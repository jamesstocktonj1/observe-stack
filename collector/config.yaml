extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:

  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: otel
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    ttl: 72h
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [health_check]

  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, clickhouse]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, clickhouse]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, clickhouse]
